<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainingstagebuch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">Gym Logbuch</p>
                <h1>Mein Training</h1>
            </div>
            <div class="nav-tabs" aria-label="Seiten">
                <button class="tab-button active" id="trainingTab" type="button">Training</button>
                <button class="tab-button" id="statisticsTab" type="button">Statistik</button>
                <button class="tab-button" id="exerciseTab" type="button">Übungen bearbeiten</button>
            </div>
        </header>

        <section class="page active" id="trainingPage">
            <div id="trainingOverview">
                <div class="panel-heading overview-heading">
                    <h2>Letzte Trainingseinheiten</h2>
                    <div class="overview-actions">
                        <button class="primary-button new-training-button" id="newTrainingButton" type="button">+ Neues Training hinzufügen</button>
                        <button class="secondary-button" id="loadTestDataButton" type="button">Testdaten aus JSON laden</button>
                        <input type="file" id="testDataFile" accept=".json,application/json" hidden>
                    </div>
                </div>
                <p class="message" id="testDataMessage" aria-live="polite"></p>
                <div class="training-session-list" id="trainingSessions"></div>
            </div>

            <div class="panel training-form-panel" id="trainingFormPanel" hidden>
                <h2 id="trainingFormHeading">Neues Training</h2>
                <form id="trainingForm">
                    <label for="trainingDate">Datum</label>
                    <input type="date" id="trainingDate" required>

                    <label for="trainingName">Trainingsname</label>
                    <input type="text" id="trainingName" placeholder="Zum Beispiel Push-Tag" required>

                    <div class="exercise-entry-list" id="exerciseEntries"></div>
                    <button class="secondary-button add-exercise-entry-button" id="addExerciseEntryButton" type="button">+ Übung hinzufügen</button>
                    <p class="message" id="trainingMessage"></p>
                    <div class="form-actions">
                        <button class="secondary-button cancel-training-button" id="cancelTrainingButton" type="button">Abbrechen</button>
                        <button class="primary-button" id="saveTrainingButton" type="submit">Training speichern</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="page" id="statisticsPage">
            <div class="layout stats-layout">
                <div class="stat-card">
                    <p>Trainings</p>
                    <strong id="trainingCount">0</strong>
                </div>
                <div class="stat-card">
                    <p>Übungen</p>
                    <strong id="exerciseCount">0</strong>
                </div>
                <div class="stat-card">
                    <p>Gesamtanzahl Sätze</p>
                    <strong id="setTotal">0</strong>
                </div>
            </div>

            <div class="layout">
                <div class="panel chart-panel">
                    <h2>Häufigste Übungen</h2>
                    <div class="bar-chart" id="exerciseChart"></div>
                </div>
            </div>

            <div class="exercise-charts" id="exerciseCharts"></div>
        </section>

        <section class="page" id="exercisePage">
            <div class="panel">
                <h2>Neue Übung hinzufügen</h2>
                <form class="exercise-form" id="exerciseForm">
                    <label for="newExerciseName">Name der Übung</label>
                    <input type="text" id="newExerciseName" placeholder="Zum Beispiel Kreuzheben" required>
                    <button class="primary-button" id="addExerciseButton" type="submit">Zur Datenbank hinzufügen</button>
                </form>
                <p class="message" id="exerciseMessage"></p>
            </div>

            <div class="panel table-panel">
                <h2>Übungen in der Datenbank bearbeiten</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Übungsname</th>
                                <th>Name ändern</th>
                            </tr>
                        </thead>
                        <tbody id="exerciseTable"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
